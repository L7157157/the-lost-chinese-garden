<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>The Lost Chinese Garden · AR</title>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    /* 顶部提示条 */
    #hint {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.45);
      color: white;
      font-size: 14px;
      text-align: center;
      box-sizing: border-box;
      padding-top: max(12px, env(safe-area-inset-top));
    }
    #hint p { margin: 6px 0; }
    #detail { font-size: 12px; opacity: 0.85; }
    progress { width: min(100%, 360px); height: 8px; }
    button {
      margin-top: 10px; padding: 12px 20px; min-height: 44px;
      border: 0; border-radius: 8px; background: white; color: #111;
      font: inherit; cursor: pointer;
    }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <!-- 提示 UI -->
  <div id="hint">
    <p id="status" role="status" aria-live="polite">Preparing The Lost Chinese Garden…</p>
    <p id="detail">Please keep this page open.</p>
    <progress id="progress" aria-label="Resource download progress" max="100"></progress>
    <br />
    <button id="start" type="button" hidden>Start AR</button>
    <button id="retry" type="button" hidden>Try again</button>
  </div>

  <!-- AR 场景 -->
  <a-scene
    mindar-image="autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; missTolerance: 8; warmupTolerance: 5; filterMinCF: 0.0001; filterBeta: 0.001;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true;"
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- Even illumination keeps shaded parts of the model visible. -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.5"></a-entity>

    <!-- 海报识别目标 -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <!-- Lights follow the poster so illumination stays consistent while viewing. -->
      <a-entity
        light="type: directional; color: #ffffff; intensity: 2"
        position="2 4 3"
      ></a-entity>
      <a-entity
        light="type: directional; color: #ffffff; intensity: 1"
        position="-3 1 -2"
      ></a-entity>

      <!-- 你的 3D 模型 -->
      <a-gltf-model
        id="model"
        visible="false"
        position="0 0 0"
        rotation="0 270 0"
        scale="2 2 2"
      ></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
  (() => {
    // Bump ASSET_VERSION whenever model.glb or poster.mind changes.
    // Deploy a self-contained GLB (embedded textures) beside this HTML over HTTPS.
    const ASSET_VERSION = "festival-1";
    const CACHE_NAME = "lost-garden-assets";
    const assetURL = name => new URL(`${name}?v=${ASSET_VERSION}`, location.href).href;
    const scene = document.querySelector("a-scene");
    const model = document.getElementById("model");
    const target = document.getElementById("target");
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    const progress = document.getElementById("progress");
    const start = document.getElementById("start");
    const retry = document.getElementById("retry");
    let cache;
    let modelReady = false;
    let arReady = false;
    let starting = false;
    let targetVisible = false;
    let seenTarget = false;
    let failed = false;
    let arTimer;
    const objectURLs = [];

    function message(text, subtext = "") {
      status.textContent = text;
      detail.textContent = subtext;
    }

    function updateView() {
      model.setAttribute("visible", !failed && arReady && modelReady && targetVisible && !document.hidden);
      if (failed || !arReady) return;
      if (document.hidden) return;
      message(targetVisible
        ? "The Lost Chinese Garden is revealed."
        : seenTarget ? "Keep the poster in view to continue exploring."
        : "Point your camera at the poster.",
        targetVisible ? "Move slowly to explore the garden." : "Keep the whole poster in view and hold your phone steady.");
    }

    function fail(text) {
      failed = true;
      clearTimeout(arTimer);
      progress.hidden = true;
      start.hidden = true;
      retry.hidden = false;
      message(text, "Check your connection and camera permission, then try again.");
      updateView();
      // Also release the camera if startup stalled before arReady.
      const system = scene.systems?.["mindar-image-system"];
      system?.video?.srcObject?.getTracks().forEach(track => track.stop());
      if (arReady) system.pause();
    }

    async function download(name, label) {
      const url = assetURL(name);
      message(`Preparing ${label}…`);
      progress.removeAttribute("value");
      try {
        const hit = await cache?.match(url);
        if (hit) {
          message(`Loading saved ${label}…`);
          return await hit.blob();
        }
      } catch (error) { console.warn("Cache read unavailable", error); }

      const controller = new AbortController();
      let timer;
      const resetTimeout = () => {
        clearTimeout(timer);
        timer = setTimeout(() => controller.abort(), 45000);
      };
      resetTimeout();
      try {
        const response = await fetch(url, {signal: controller.signal});
        if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
        const length = Number(response.headers.get("content-length"));
        const encoded = response.headers.get("content-encoding");
        const total = !encoded || encoded === "identity" ? length : 0;
        let blob;
        if (response.body) {
          const reader = response.body.getReader();
          const chunks = [];
          let received = 0;
          while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            resetTimeout();
            chunks.push(value);
            received += value.byteLength;
            const mb = (received / 1048576).toFixed(1);
            if (total > 0 && received <= total) {
              const percent = Math.floor(received / total * 100);
              progress.value = percent;
              message(`Downloading ${label} · ${percent}%`, `${mb} MB received`);
            } else {
              progress.removeAttribute("value");
              message(`Downloading ${label}…`, `${mb} MB received`);
            }
          }
          blob = new Blob(chunks, {type: response.headers.get("content-type") || "application/octet-stream"});
        } else {
          blob = await response.blob();
        }
        if (!blob.size) throw new Error(`${name} is empty`);
        return blob;
      } finally { clearTimeout(timer); }
    }

    async function save(name, blob) {
      try { await cache?.put(assetURL(name), new Response(blob)); }
      catch (error) { console.warn("Cache write unavailable; continuing without persistent cache", error); }
    }

    function blobURL(blob) {
      const url = URL.createObjectURL(blob);
      objectURLs.push(url);
      return url;
    }

    function applyHologram() {
      const THREE = AFRAME.THREE;
      const root = model.getObject3D("mesh");
      if (!root) throw new Error("The model has no mesh");

      // Measure in model space, independent of UVs and the tracked poster's pose.
      const bounds = new THREE.Box3();
      const localMatrix = new THREE.Matrix4();
      root.traverse(node => {
        if (!node.isMesh || !node.geometry) return;
        node.geometry.computeBoundingBox();
        localMatrix.identity();
        for (let part = node; part && part !== model.object3D; part = part.parent) {
          if (part.matrixAutoUpdate) part.updateMatrix();
          localMatrix.premultiply(part.matrix);
        }
        bounds.union(node.geometry.boundingBox.clone().applyMatrix4(localMatrix));
      });
      if (bounds.isEmpty()) throw new Error("The model has no geometry");
      const uniforms = {
        uHoloTime: {value: 0},
        uHoloInverse: {value: new THREE.Matrix4()},
        uHoloBottom: {value: bounds.min.y},
        uHoloHeight: {value: Math.max(bounds.max.y - bounds.min.y, 0.001)}
      };
      const startedAt = performance.now();
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const materials = new Map();
      const convert = original => {
        if (materials.has(original)) return materials.get(original);
        const material = new THREE.MeshStandardMaterial({
          color: "#269f9e",
          emissive: "#087f80",
          emissiveIntensity: 0.35,
          roughness: 0.5,
          metalness: 0.1,
          opacity: 0.8,
          transparent: true,
          depthWrite: true,
          depthTest: true,
          side: original.side,
          // Retain cutout silhouettes without the original colored surface texture.
          map: original.map || null,
          alphaMap: original.alphaMap || null,
          alphaTest: original.alphaTest || 0,
          blending: THREE.NormalBlending
        });
        material.onBeforeCompile = shader => {
          Object.assign(shader.uniforms, uniforms);
          shader.vertexShader = `
            uniform mat4 uHoloInverse;
            varying float vHoloY;
          ` + shader.vertexShader;
          shader.vertexShader = shader.vertexShader.replace(
            "#include <project_vertex>",
            `#include <project_vertex>
             vec4 holoPosition = vec4(transformed, 1.0);
             #ifdef USE_INSTANCING
               holoPosition = instanceMatrix * holoPosition;
             #endif
             vHoloY = (uHoloInverse * modelMatrix * holoPosition).y;`
          );
          shader.fragmentShader = `
            uniform float uHoloTime;
            uniform float uHoloBottom;
            uniform float uHoloHeight;
            varying float vHoloY;
          ` + shader.fragmentShader;
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <map_fragment>",
            `#include <map_fragment>
             diffuseColor.rgb = diffuse;`
          );
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <emissivemap_fragment>",
            `#include <emissivemap_fragment>
             float height = (vHoloY - uHoloBottom) / uHoloHeight;
             // Subtract time so the horizontal bands travel upward, one height / 40s.
             float phase = (height - uHoloTime * 0.025) * 32.0;
             float wave = 0.5 + 0.5 * cos(phase * 6.2831853);
             float scan = smoothstep(0.86, 0.99, wave);
             // Fade fine lines at a distance to reduce shimmering on phone screens.
             scan *= 1.0 - smoothstep(0.2, 0.65, fwidth(phase));
             float facingEdge = clamp(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0);
             float rim = pow(facingEdge, 2.5);
             float outerRim = pow(facingEdge, 7.0);
             float flicker = 1.0 + 0.018 * sin(uHoloTime * 5.1)
                                 + 0.012 * sin(uHoloTime * 8.3);
             // Teal body, brighter cyan-green shoulder, pale highlights at the silhouette.
             totalEmissiveRadiance += vec3(0.06, 0.80, 0.72) * scan * 0.30;
             totalEmissiveRadiance += vec3(0.12, 0.90, 0.82) * rim * 1.10;
             totalEmissiveRadiance += vec3(0.55, 1.00, 0.90) * outerRim * 1.65;
             totalEmissiveRadiance *= flicker;
             diffuseColor.a *= clamp(0.96 + rim * 0.08 + scan * 0.025, 0.0, 1.0);`
          );
        };
        material.customProgramCacheKey = () => "garden-hologram-height-v3";
        materials.set(original, material);
        return material;
      };
      root.traverse(node => {
        if (!node.isMesh || !node.material) return;
        node.material = Array.isArray(node.material)
          ? node.material.map(convert) : convert(node.material);
        const previousRender = node.onBeforeRender;
        node.onBeforeRender = function (...args) {
          previousRender.apply(this, args);
          uniforms.uHoloTime.value = reduceMotion.matches ? 0 : (performance.now() - startedAt) / 1000;
          uniforms.uHoloInverse.value.copy(model.object3D.matrixWorld).invert();
        };
      });
    }

    function loadModel(blob) {
      return new Promise((resolve, reject) => {
        const cleanup = () => {
          clearTimeout(timer);
          model.removeEventListener("model-loaded", loaded);
          model.removeEventListener("model-error", error);
        };
        const loaded = () => {
          cleanup();
          try {
            applyHologram();
            modelReady = true;
            resolve();
          } catch (error) { reject(error); }
        };
        const error = () => { cleanup(); reject(new Error("Model parsing failed")); };
        const timer = setTimeout(() => {
          cleanup(); reject(new Error("Model parsing timed out"));
        }, 90000);
        model.addEventListener("model-loaded", loaded);
        model.addEventListener("model-error", error);
        model.setAttribute("src", blobURL(blob));
      });
    }

    target.addEventListener("targetFound", () => {
      targetVisible = true;
      seenTarget = true;
      updateView();
    });
    target.addEventListener("targetLost", () => {
      targetVisible = false;
      updateView();
    });
    scene.addEventListener("arError", () => fail("Unable to start the camera. Please allow camera access."));
    let posterBlob;
    scene.addEventListener("arReady", () => {
      if (failed) {
        scene.systems["mindar-image-system"].pause();
        return;
      }
      clearTimeout(arTimer);
      arReady = true;
      starting = false;
      progress.hidden = true;
      void save("poster.mind", posterBlob);
      updateView();
      if (document.hidden) scene.systems["mindar-image-system"].pause(true);
    });
    start.addEventListener("click", () => {
      if (starting || arReady || failed || !modelReady) return;
      starting = true;
      start.hidden = true;
      progress.hidden = false;
      progress.removeAttribute("value");
      message("Starting camera…", "Allow camera access when prompted.");
      arTimer = setTimeout(() => fail("Camera setup is taking too long."), 60000);
      try { scene.systems["mindar-image-system"].start(); }
      catch (error) { console.error(error); fail("Unable to start AR on this device."); }
    });
    retry.addEventListener("click", async () => {
      retry.disabled = true;
      // Drop only this artwork's current resources, including a possibly corrupt download.
      try {
        await Promise.all(["model.glb", "poster.mind"].map(name => cache?.delete(assetURL(name))));
      } catch (error) { console.warn(error); }
      location.reload();
    });
    document.addEventListener("visibilitychange", () => {
      if (!arReady || failed) return;
      const system = scene.systems["mindar-image-system"];
      // Keep the video alive but pause image processing in the background.
      if (document.hidden) system.pause(true);
      else {
        targetVisible = false;
        // Force a fresh targetFound event after returning to the page.
        target.object3D.visible = false;
        system.unpause();
      }
      updateView();
    });
    window.addEventListener("pagehide", event => {
      if (!event.persisted) objectURLs.forEach(url => URL.revokeObjectURL(url));
    });

    async function prepare() {
      if (!window.AFRAME || !AFRAME.components["mindar-image"]) {
        fail("AR could not load. Please check your connection.");
        return;
      }
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        fail("Open this experience in Safari or Chrome using its HTTPS link.");
        return;
      }
      try {
        try { cache = await caches.open(CACHE_NAME); }
        catch (error) { console.warn("Persistent cache unavailable", error); }
        // Download immediately; do not wait for poster detection or camera permission.
        const modelBlob = await download("model.glb", "garden model");
        message("Preparing the 3D garden…", "The download is complete. Preparing textures and geometry.");
        progress.removeAttribute("value");
        if (!scene.hasLoaded) await new Promise((resolve, reject) => {
          const loaded = () => { clearTimeout(timer); resolve(); };
          const timer = setTimeout(() => {
            scene.removeEventListener("loaded", loaded);
            reject(new Error("AR scene initialization timed out"));
          }, 30000);
          scene.addEventListener("loaded", loaded, {once: true});
        });
        await loadModel(modelBlob);
        void save("model.glb", modelBlob);
        posterBlob = await download("poster.mind", "poster recognition");
        // The system copies component settings during init; set its source before start().
        scene.systems["mindar-image-system"].imageTargetSrc = blobURL(posterBlob);
        progress.hidden = true;
        start.hidden = false;
        message("The garden is ready.", "Tap Start AR, allow camera access, then point at the poster.");
      } catch (error) {
        console.error(error);
        fail("Unable to prepare the garden. Please try again.");
      }
    }
    void prepare();
  })();
  </script>
</body>
</html>

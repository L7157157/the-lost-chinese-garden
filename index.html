<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>2026 Nuit Blanche / Night Market for a Future Garden</title>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    /* Full-screen memory introduction; compact overlay after camera startup. */
    #hint {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.45);
      color: white;
      font-size: 14px;
      text-align: center;
      box-sizing: border-box;
      padding-top: max(12px, env(safe-area-inset-top));
    }
    #hint p { margin: 6px 0; }
    #status, #detail { white-space: pre-line; }
    #detail { font-size: 12px; opacity: 0.95; }
    progress { width: min(100%, 360px); height: 8px; }
    button {
      margin-top: 10px; padding: 12px 20px; min-height: 44px;
      border: 0; border-radius: 8px; background: white; color: #111;
      font: inherit; cursor: pointer;
    }
    #hint.intro {
      inset: 0;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: max(32px, env(safe-area-inset-top)) 7vw max(32px, env(safe-area-inset-bottom));
      text-align: left;
      color: #fff0e7;
      background: radial-gradient(ellipse at 18% 22%, #c78e9a 0%, transparent 55%), radial-gradient(ellipse at 84% 72%, #d79a66 0%, transparent 58%), #514449;
      overflow-y: auto;
    }
    #hint.intro::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0 5px, #fff0e708 5px 6px);
    }
    .intro-only { display: none; }
    .intro .intro-only { display: block; }
    .intro .eyebrow { font-size: 11px; letter-spacing: 0.24em; color: #8fc6bc; }
    .intro .archive-title {
      margin-top: 3vh !important;
      font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      font-size: clamp(30px, 8vw, 56px);
      line-height: 1.15;
      letter-spacing: -0.04em;
      color: #fff3e8;
    }
    .intro .archive-note { margin: 20px 0 3vh !important; color: #f0d3c7; line-height: 1.9; font-size: 14px; }
    .intro #status { font-size: clamp(20px, 5.5vw, 30px); font-weight: 500; letter-spacing: 0.06em; }
    .intro #detail { margin-top: 12px; line-height: 1.8; font-size: 14px; max-width: 36em; }
    .intro progress { width: 100%; margin-top: 24px; accent-color: #8cf5df; }
    .intro button {
      width: 100%; min-height: 68px; margin-top: 30px; padding: 20px;
      border: 1px solid #f6c5a0; border-radius: 2px;
      background: #f0b58d; color: #452f32; font-size: 20px; letter-spacing: 0.16em;
      box-shadow: 0 0 36px #e7a28c30;
    }
    #hint.intro #start { border-radius: 999px; }
    .title-zh { display: block; margin-top: 14px; font-size: 0.68em; letter-spacing: 0.02em; }
    #start span { display: block; }
    #start span + span { margin-top: 6px; font-size: 0.85em; }
    .intro > * { flex-shrink: 0; }
    button:focus-visible { outline: 3px solid #ffffff; outline-offset: 5px; }
    .intro .archive-footer { margin-top: 3vh !important; font-size: 10px; letter-spacing: 0.17em; color: #8fc6bc; }
    @media (min-width: 700px) {
      #hint.intro { padding-left: max(7vw, calc((100vw - 640px) / 2)); padding-right: max(7vw, calc((100vw - 640px) / 2)); }
    }
    @media (max-height: 650px) {
      #hint.intro { justify-content: flex-start; }
      .intro .archive-title { margin-top: 20px !important; font-size: 30px; }
      .intro .archive-note { margin: 14px 0 20px !important; }
      .intro .archive-footer { margin-top: 24px !important; }
    }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <!-- 提示 UI -->
  <div id="hint" class="intro">
    <p class="intro-only archive-title"><span lang="en">There was once a Chinese garden here.</span><span class="title-zh">這裡曾經有一座中國花園。</span></p>
    <p class="intro-only archive-note"><span lang="en">This garden was once part of China Court (文華邨), 1976–1986.</span></p>
    <p id="status" role="status" aria-live="polite">Awakening memories… / 正在喚醒記憶…</p>
    <p id="detail">Keep this page open. / 請保持頁面開啟。</p>
    <progress id="progress" aria-label="Memory loading progress / 記憶載入進度" max="100"></progress>
    <button id="start" type="button" hidden><span lang="en">Begin remembering</span><span>開始回憶</span></button>
    <button id="retry" type="button" hidden>Try again / 重新嘗試</button>
  </div>

  <!-- AR 场景 -->
  <a-scene
    gltf-model="meshoptDecoderPath: ./vendor/meshopt_decoder-0.20.0.js"
    mindar-image="autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; missTolerance: 8; warmupTolerance: 5; filterMinCF: 0.0001; filterBeta: 0.001;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true;"
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- Soft ambient fill preserves detail without flattening shaded surfaces. -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.65"></a-entity>

    <!-- 历史报纸识别目标 -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <!-- Lights follow the newspaper so illumination stays consistent while viewing. -->
      <a-entity
        light="type: directional; color: #ffffff; intensity: 2.4"
        position="2 4 3"
      ></a-entity>
      <a-entity
        light="type: directional; color: #ffffff; intensity: 0.55"
        position="-3 1 -2"
      ></a-entity>

      <!-- 你的 3D 模型 -->
      <a-gltf-model
        id="model"
        visible="false"
        position="0 0 0"
        rotation="0 270 0"
        scale="2 2 2"
      ></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
  (() => {
    // Bump ASSET_VERSION whenever model-optimized.glb or poster.mind changes.
    // Deploy a self-contained GLB (embedded textures) beside this HTML over HTTPS.
    const ASSET_VERSION = "festival-7-memory";
    const CACHE_NAME = "lost-garden-assets";
    const assetURL = name => new URL(`${name}?v=${ASSET_VERSION}`, location.href).href;
    const scene = document.querySelector("a-scene");
    const model = document.getElementById("model");
    const target = document.getElementById("target");
    const status = document.getElementById("status");
    const hint = document.getElementById("hint");
    const detail = document.getElementById("detail");
    const progress = document.getElementById("progress");
    const start = document.getElementById("start");
    const retry = document.getElementById("retry");
    let cache;
    let modelReady = false;
    let arReady = false;
    let starting = false;
    let targetVisible = false;
    let seenTarget = false;
    let failed = false;
    let arTimer;
    const objectURLs = [];

    function message(text, subtext = "") {
      status.textContent = text.replaceAll(" / ", "\n");
      detail.textContent = subtext.replaceAll(" / ", "\n");
    }

    function updateView() {
      model.setAttribute("visible", !failed && arReady && modelReady && targetVisible && !document.hidden);
      if (failed || !arReady) return;
      if (document.hidden) return;
      message(targetVisible
        ? "The garden returns. / 記憶中的花園，正在重現。"
        : seenTarget ? "Bring the newspaper back into view. / 請將歷史報紙重新放入畫面"
        : "Point your camera at the historic newspaper. / 請將鏡頭對準歷史報紙。",
        targetVisible ? "Move slowly to explore the garden. / 緩緩移動鏡頭，探索記憶中的花園。" : "Keep the whole newspaper in view and hold steady. / 讓整張歷史報紙進入畫面，並保持手機平穩。");
    }

    function fail(text) {
      failed = true;
      hint.classList.add("intro");
      clearTimeout(arTimer);
      progress.hidden = true;
      start.hidden = true;
      retry.hidden = false;
      message(text, "Check your connection and camera permission, then try again. / 請檢查網絡連線和相機權限，然後重新嘗試。");
      updateView();
      // Also release the camera if startup stalled before arReady.
      const system = scene.systems?.["mindar-image-system"];
      system?.video?.srcObject?.getTracks().forEach(track => track.stop());
      if (arReady) system.pause();
    }

    async function download(name, label) {
      const url = assetURL(name);
      message(`Preparing ${label[0]}… / 正在準備${label[1]}…`);
      progress.removeAttribute("value");
      try {
        const hit = await cache?.match(url);
        if (hit) {
          message(`Loading saved ${label[0]}… / 正在讀取已儲存的${label[1]}…`);
          return await hit.blob();
        }
      } catch (error) { console.warn("Cache read unavailable", error); }

      const controller = new AbortController();
      let timer;
      const resetTimeout = () => {
        clearTimeout(timer);
        timer = setTimeout(() => controller.abort(), 45000);
      };
      resetTimeout();
      try {
        const response = await fetch(url, {signal: controller.signal});
        if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
        const length = Number(response.headers.get("content-length"));
        const encoded = response.headers.get("content-encoding");
        const total = !encoded || encoded === "identity" ? length : 0;
        let blob;
        if (response.body) {
          const reader = response.body.getReader();
          const chunks = [];
          let received = 0;
          while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            resetTimeout();
            chunks.push(value);
            received += value.byteLength;
            const mb = (received / 1048576).toFixed(1);
            if (total > 0 && received <= total) {
              const percent = Math.floor(received / total * 100);
              progress.value = percent;
              message(`Loading ${label[0]} · ${percent}% / 正在載入${label[1]} · ${percent}%`, `${mb} MB received / 已載入 ${mb} MB`);
            } else {
              progress.removeAttribute("value");
              message(`Loading ${label[0]}… / 正在載入${label[1]}…`, `${mb} MB received / 已載入 ${mb} MB`);
            }
          }
          blob = new Blob(chunks, {type: response.headers.get("content-type") || "application/octet-stream"});
        } else {
          blob = await response.blob();
        }
        if (!blob.size) throw new Error(`${name} is empty`);
        return blob;
      } finally { clearTimeout(timer); }
    }

    async function save(name, blob) {
      try { await cache?.put(assetURL(name), new Response(blob)); }
      catch (error) { console.warn("Cache write unavailable; continuing without persistent cache", error); }
    }

    function blobURL(blob) {
      const url = URL.createObjectURL(blob);
      objectURLs.push(url);
      return url;
    }

    function applyHologram() {
      const THREE = AFRAME.THREE;
      const root = model.getObject3D("mesh");
      if (!root) throw new Error("The model has no mesh");

      // Screen-space bands stay horizontal even on sloped roofs and rotated posters.
      const viewportSize = new THREE.Vector2();
      const uniforms = {
        uHoloTime: {value: 0},
        uHoloViewportHeight: {value: 1}
      };
      const startedAt = performance.now();
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const materials = new Map();
      const convert = original => {
        if (materials.has(original)) return materials.get(original);
        const material = new THREE.MeshStandardMaterial({
          color: original.color ? original.color.clone() : new THREE.Color("#ffffff"),
          emissive: "#087f80",
          emissiveIntensity: 0.3,
          roughness: 0.5,
          metalness: 0.1,
          opacity: 0.9,
          transparent: true,
          depthWrite: true,
          depthTest: true,
          side: original.side,
          // Preserve original texture color and cutout silhouettes before the teal mix.
          map: original.map || null,
          normalMap: original.normalMap || null,
          normalScale: original.normalScale ? original.normalScale.clone() : new THREE.Vector2(1, 1),
          alphaMap: original.alphaMap || null,
          alphaTest: original.alphaTest || 0,
          blending: THREE.NormalBlending
        });
        material.onBeforeCompile = shader => {
          Object.assign(shader.uniforms, uniforms);
          shader.fragmentShader = `
            uniform float uHoloTime;
            uniform float uHoloViewportHeight;
          ` + shader.fragmentShader;
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <map_fragment>",
            `#include <map_fragment>
             // Keep 55% of the original material + texture color beneath the cyan tint.
             vec3 memoryColor = diffuseColor.rgb;
             float memoryLuma = dot(memoryColor, vec3(0.2126, 0.7152, 0.0722));
             vec3 tealColor = vec3(0.025, 0.42, 0.39) * (0.25 + memoryLuma * 0.9);
             diffuseColor.rgb = mix(tealColor, memoryColor, 0.55);`
          );
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <emissivemap_fragment>",
            `#include <emissivemap_fragment>
             float height = gl_FragCoord.y / max(uHoloViewportHeight, 1.0);
             // Gentle bands travel upward across the screen, independent of mesh UVs.
             float phase = (height - uHoloTime * 0.018) * 24.0;
             float wave = 0.5 + 0.5 * cos(phase * 6.2831853);
             float scan = smoothstep(0.50, 0.98, wave);
             // Fade fine lines at a distance to reduce shimmering on phone screens.
             scan *= 1.0 - smoothstep(0.2, 0.65, fwidth(phase));
             float facingEdge = clamp(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0);
             float rim = pow(facingEdge, 2.0);
             float outerRim = pow(facingEdge, 4.5);
             // Broad soft teal falloff builds into a brighter, pale silhouette.
             totalEmissiveRadiance += vec3(0.06, 0.80, 0.72) * scan * 0.18;
             totalEmissiveRadiance += vec3(0.12, 0.90, 0.82) * rim * 1.4;
             totalEmissiveRadiance += vec3(0.55, 1.00, 0.90) * outerRim * 2.4;
             totalEmissiveRadiance += diffuseColor.rgb * 0.08;
             diffuseColor.a *= clamp(0.96 + rim * 0.08 + scan * 0.025, 0.0, 1.0);`
          );
        };
        material.customProgramCacheKey = () => "garden-memory-hologram-v6";
        materials.set(original, material);
        return material;
      };
      root.traverse(node => {
        if (!node.isMesh || !node.material) return;
        node.material = Array.isArray(node.material)
          ? node.material.map(convert) : convert(node.material);
        const previousRender = node.onBeforeRender;
        node.onBeforeRender = function (...args) {
          previousRender.apply(this, args);
          const elapsed = (performance.now() - startedAt) / 1000;
          uniforms.uHoloTime.value = reduceMotion.matches ? 0 : elapsed;
          args[0].getDrawingBufferSize(viewportSize);
          uniforms.uHoloViewportHeight.value = viewportSize.y;
        };
      });
    }

    function loadModel(blob) {
      return new Promise((resolve, reject) => {
        const cleanup = () => {
          clearTimeout(timer);
          model.removeEventListener("model-loaded", loaded);
          model.removeEventListener("model-error", error);
        };
        const loaded = () => {
          cleanup();
          try {
            applyHologram();
            modelReady = true;
            resolve();
          } catch (error) { reject(error); }
        };
        const error = () => { cleanup(); reject(new Error("Model parsing failed")); };
        const timer = setTimeout(() => {
          cleanup(); reject(new Error("Model parsing timed out"));
        }, 90000);
        model.addEventListener("model-loaded", loaded);
        model.addEventListener("model-error", error);
        model.setAttribute("src", blobURL(blob));
      });
    }

    target.addEventListener("targetFound", () => {
      targetVisible = true;
      seenTarget = true;
      updateView();
    });
    target.addEventListener("targetLost", () => {
      targetVisible = false;
      updateView();
    });
    scene.addEventListener("arError", () => fail("Unable to start the camera. Please allow access. / 無法啟動相機，請允許相機存取。"));
    let posterBlob;
    scene.addEventListener("arReady", () => {
      if (failed) {
        scene.systems["mindar-image-system"].pause();
        return;
      }
      clearTimeout(arTimer);
      arReady = true;
      hint.classList.remove("intro");
      starting = false;
      progress.hidden = true;
      void save("poster.mind", posterBlob);
      updateView();
      if (document.hidden) scene.systems["mindar-image-system"].pause(true);
    });
    start.addEventListener("click", () => {
      if (starting || arReady || failed || !modelReady) return;
      starting = true;
      start.hidden = true;
      progress.hidden = false;
      progress.removeAttribute("value");
      message("Opening memories… / 正在開啟回憶…", "Allow camera access when prompted. / 請在提示出現時允許相機存取。");
      arTimer = setTimeout(() => fail("Camera startup timed out. Please try again. / 相機啟動逾時，請重新嘗試。"), 60000);
      try { scene.systems["mindar-image-system"].start(); }
      catch (error) { console.error(error); fail("Unable to start this experience on your device. / 暫時無法在此裝置上開啟回憶。"); }
    });
    retry.addEventListener("click", async () => {
      retry.disabled = true;
      // Drop only this artwork's current resources, including a possibly corrupt download.
      try {
        await Promise.all(["model-optimized.glb", "poster.mind"].map(name => cache?.delete(assetURL(name))));
      } catch (error) { console.warn(error); }
      location.reload();
    });
    document.addEventListener("visibilitychange", () => {
      if (!arReady || failed) return;
      const system = scene.systems["mindar-image-system"];
      // Keep the video alive but pause image processing in the background.
      if (document.hidden) system.pause(true);
      else {
        targetVisible = false;
        // Force a fresh targetFound event after returning to the page.
        target.object3D.visible = false;
        system.unpause();
      }
      updateView();
    });
    window.addEventListener("pagehide", event => {
      if (!event.persisted) objectURLs.forEach(url => URL.revokeObjectURL(url));
    });

    async function prepare() {
      if (!window.AFRAME || !AFRAME.components["mindar-image"]) {
        fail("Unable to load the experience. Check your connection. / 記憶體驗載入失敗，請檢查網絡連線。");
        return;
      }
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        fail("Open the HTTPS link in Safari or Chrome. / 請使用 Safari 或 Chrome，透過 HTTPS 連結開啟體驗。");
        return;
      }
      try {
        try { cache = await caches.open(CACHE_NAME); }
        catch (error) { console.warn("Persistent cache unavailable", error); }
        // Download immediately; do not wait for poster detection or camera permission.
        const modelBlob = await download("model-optimized.glb", ["garden memories", "花園記憶"]);
        message("Restoring the garden… / 正在還原花園…", "Download complete. Preparing the details. / 下載已完成，正在整理記憶中的細節。");
        progress.removeAttribute("value");
        if (!scene.hasLoaded) await new Promise((resolve, reject) => {
          const loaded = () => { clearTimeout(timer); resolve(); };
          const timer = setTimeout(() => {
            scene.removeEventListener("loaded", loaded);
            reject(new Error("AR scene initialization timed out"));
          }, 30000);
          scene.addEventListener("loaded", loaded, {once: true});
        });
        await loadModel(modelBlob);
        void save("model-optimized.glb", modelBlob);
        posterBlob = await download("poster.mind", ["newspaper recognition data", "歷史報紙辨識資料"]);
        // The system copies component settings during init; set its source before start().
        scene.systems["mindar-image-system"].imageTargetSrc = blobURL(posterBlob);
        progress.hidden = true;
        start.hidden = false;
        message("Memories loaded / 記憶已經載入", "Tap “Begin remembering”, allow camera access, then scan the historic newspaper. / 點擊「開始回憶」，允許相機存取，再將鏡頭對準歷史報紙。");
      } catch (error) {
        console.error(error);
        fail("Unable to load memories. Please try again. / 記憶載入失敗，請重新嘗試。");
      }
    }
    void prepare();
  })();
  </script>
</body>
</html>
